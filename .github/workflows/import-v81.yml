name: Complete V8.1 import
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import-source:
    if: github.event.head_commit.message == 'Stage V8.1 source package'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild project files
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r target prefix count; do
            [ -n "$target" ] || continue
            mkdir -p "$(dirname "$target")"
            encoded="$(mktemp)"
            : > "$encoded"
            i=0
            while [ "$i" -lt "$count" ]; do
              part="$(printf '%03d' "$i")"
              cat ".github/import-chunks/${prefix}.part${part}" >> "$encoded"
              i=$((i + 1))
            done
            base64 --decode "$encoded" > "$target"
            rm -f "$encoded"
          done < .github/import-chunks/manifest.txt
          rm -rf .github/import-chunks
          rm -f .github/workflows/import-v81.yml
      - name: Commit completed V8.1 project
        shell: bash
        run: |
          git config user.name "MBG Repository Import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import complete V8.1 source and assets"
          git push
